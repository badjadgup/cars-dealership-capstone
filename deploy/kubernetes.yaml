apiVersion: v1
kind: Namespace
metadata:
  name: cars-capstone
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: cars-capstone
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: django-data
  namespace: cars-capstone
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: cars-capstone
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongo-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: cars-capstone
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-dealers
  namespace: cars-capstone
spec:
  replicas: 1
  selector:
    matchLabels: { app: cars-dealers }
  template:
    metadata:
      labels: { app: cars-dealers }
    spec:
      containers:
        - name: dealers
          image: YOUR_REGISTRY/cars-dealers:latest
          ports: [{ containerPort: 3030 }]
          envFrom: [{ secretRef: { name: cars-secrets } }]
          env:
            - { name: MONGODB_URI, value: "mongodb://mongo:27017/dealerships" }
          readinessProbe:
            httpGet: { path: /health, port: 3030 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3030 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cars-dealers
  namespace: cars-capstone
spec:
  selector: { app: cars-dealers }
  ports: [{ port: 3030, targetPort: 3030 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-sentiment
  namespace: cars-capstone
spec:
  replicas: 1
  selector:
    matchLabels: { app: cars-sentiment }
  template:
    metadata:
      labels: { app: cars-sentiment }
    spec:
      containers:
        - name: sentiment
          image: YOUR_REGISTRY/cars-sentiment:latest
          ports: [{ containerPort: 5050 }]
          envFrom: [{ secretRef: { name: cars-secrets } }]
          readinessProbe:
            httpGet: { path: /health, port: 5050 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5050 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cars-sentiment
  namespace: cars-capstone
spec:
  selector: { app: cars-sentiment }
  ports: [{ port: 5050, targetPort: 5050 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-web
  namespace: cars-capstone
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: cars-web }
  template:
    metadata:
      labels: { app: cars-web }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: YOUR_REGISTRY/cars-web:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: cars-secrets } }]
          env:
            - { name: DEBUG, value: "true" }
            - { name: ALLOWED_HOSTS, value: "localhost,127.0.0.1" }
            - { name: DEALERSHIP_URL, value: "http://cars-dealers:3030" }
            - { name: SENTIMENT_URL, value: "http://cars-sentiment:5050" }
            - { name: SQLITE_PATH, value: "/data/db.sqlite3" }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders: [{ name: Host, value: localhost }]
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders: [{ name: Host, value: localhost }]
            initialDelaySeconds: 60
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: django-data }
---
apiVersion: v1
kind: Service
metadata:
  name: cars-web
  namespace: cars-capstone
spec:
  selector: { app: cars-web }
  ports: [{ port: 80, targetPort: 8000 }]
